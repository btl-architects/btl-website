name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_test_filter:
        description: Optional regex for manual diagnostics; PR and main always run the full browser suite
        type: string
        required: false
        default: ''
permissions:
  contents: read
  checks: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SANITY_PROJECT_ID: aur12nrf
      SANITY_DATASET: production
      SANITY_PREVIEW: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: image-cache
        with:
          path: web/node_modules/.astro/btl-media-v1
          key: btl-media-v1-${{ github.sha }}
          restore-keys: btl-media-v1-
      - run: npm test
      - id: build
        run: npm run build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: web/node_modules/.astro/btl-media-v1
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Find the deployed preview for this commit
        id: preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/wait-deployed-preview.mjs
      - name: Measure deployed mobile performance
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: npm run test:performance
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-check-results
          path: web/reports/
  # The browser suite, once per engine, side by side. It ran Chromium, WebKit
  # and Firefox one after another in the job above, about 30 minutes; each
  # engine on its own runner takes about a third of that. Each job builds the
  # site itself from the shared image cache rather than waiting on the job
  # above. fail-fast is off so one engine's failure never hides another's.
  browsers:
    name: browsers (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    defaults:
      run:
        working-directory: web
    env:
      SANITY_PROJECT_ID: aur12nrf
      SANITY_DATASET: production
      SANITY_PREVIEW: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/node_modules/.astro/btl-media-v1
          key: btl-media-v1-${{ github.sha }}
          restore-keys: btl-media-v1-
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser checks
        env:
          BROWSER_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_test_filter || '' }}
        run: |
          if [ -n "$BROWSER_TEST_FILTER" ]; then
            npx playwright test --project=${{ matrix.browser }} --grep "$BROWSER_TEST_FILTER"
          else
            npx playwright test --project=${{ matrix.browser }}
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}
          path: |
            web/playwright-report/
            web/test-results/
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: aur12nrf
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
