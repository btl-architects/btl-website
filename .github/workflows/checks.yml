name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_test_filter:
        description: Optional regex for manual diagnostics; PR and main always run the full browser suite
        type: string
        required: false
        default: ''
permissions:
  contents: read
  checks: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SANITY_PROJECT_ID: aur12nrf
      SANITY_DATASET: production
      SANITY_PREVIEW: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: image-cache
        with:
          path: web/node_modules/.astro/btl-media-v1
          key: btl-media-v1-${{ github.sha }}
          restore-keys: btl-media-v1-
      - run: npm test
      - id: build
        run: npm run build
      - uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        if: steps.image-cache.outputs.cache-hit != 'true'
        with:
          path: web/node_modules/.astro/btl-media-v1
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser checks
        env:
          BROWSER_TEST_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_test_filter || '' }}
        run: |
          if [ -n "$BROWSER_TEST_FILTER" ]; then
            npx playwright test --grep "$BROWSER_TEST_FILTER"
          else
            npm run test:e2e
          fi
      - name: Find the deployed preview for this commit
        id: preview
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/wait-deployed-preview.mjs
      - name: Measure deployed mobile performance
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: npm run test:performance
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: website-check-results
          path: |
            web/playwright-report/
            web/test-results/
            web/reports/
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: aur12nrf
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
