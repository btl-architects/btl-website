# Netlify configuration.
#
# The site is a static build: every route is rendered at build time and served
# as a file. Content reaches production by rebuilding — a Sanity webhook fires a
# build hook when something is published — not by a server querying at request
# time. That is what makes the live site fast and unbreakable by a CMS outage.
#
# Headers and redirects are NOT here. They live in web/public/_headers and
# web/public/_redirects, in the one format Netlify and Cloudflare Pages both
# read. Keeping the security policy in a host's own config file meant that
# changing host meant retyping the CSP, which is the last thing anybody should
# be doing under time pressure. This file now carries only what is genuinely
# Netlify's: how to run the build.
#
# The site currently deploys to Cloudflare Pages — see docs/deploying.md. This
# file is kept, and kept working, so moving back is a matter of pointing DNS.

[build]
  base    = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # SANITY_PROJECT_ID and SANITY_DATASET are set in the Netlify UI rather than
  # here. They are not secret, but configuration belongs in one place and the
  # build should fail loudly on a fresh environment rather than silently use a
  # stale value committed months earlier.

# --- preview -----------------------------------------------------------------
# A branch deploy builds the same code against Sanity's draft perspective, so
# the practice can look at unpublished work on a real URL before it goes live.
#
# SANITY_PREVIEW_TOKEN is a read-only Viewer token and lives ONLY in this
# context's environment in the Netlify UI — never in the repository, and never
# in the production context. Every preview page carries a banner and a noindex,
# because the expensive mistake is not realising which one you are looking at.

[context.branch-deploy.environment]
  SANITY_PREVIEW = "true"

[context.deploy-preview.environment]
  SANITY_PREVIEW = "true"
