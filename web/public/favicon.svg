<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The mark alone, on nothing.
       This used to sit in a filled black tile, which is what the practice saw in
       the browser tab and asked to lose. A bare black letterform then disappears
       against a dark tab strip, and a favicon cannot query the page it belongs
       to - but it CAN query the viewer's own colour scheme, so it carries both
       states itself. Light chrome gets the black mark, dark chrome the white. -->
  <style>
    .mark { fill: #050505; }
    @media (prefers-color-scheme: dark) { .mark { fill: #FFFFFF; } }
  </style>
